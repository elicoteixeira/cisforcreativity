<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C is for Creativity</title>
<meta name="description" content="C is for Creativity, a 2nd grade business by Sydney and friends.">
<meta property="og:title" content="C is for Creativity">
<meta property="og:description" content="A 2nd grade business by Sydney and friends.">
<meta property="og:image" content="https://cisforcreativity.com/images/flower.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖍️</text></svg>">
<link rel="preload" href="fonts/andika-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/andika-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- Bump ?v= whenever styles.css changes so browsers fetch the new file. -->
<link rel="stylesheet" href="styles.css?v=2">
<style>
  /* Kept in the page itself so these rules always match this markup. */
  /* Hand-drawn hearts and stars behind the hero */
  .hero { position: relative; }
  .hero-inner { position: relative; z-index: 1; }
  .doodles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .doodle {
    position: absolute;
    left: min(var(--x), calc(100% - var(--s) - 12px));
    top: var(--y);
    width: var(--s);
    height: var(--s);
    overflow: visible;
    fill: currentColor;
    fill-opacity: 0.15;
    stroke: currentColor;
    stroke-width: 6;
    stroke-linejoin: round;
    filter: url(#crayon);
    opacity: 0;
    transform: rotate(var(--r)) scale(0.4);
    animation: pop 0.5s var(--d) cubic-bezier(.3, 1.6, .5, 1) forwards;
  }
  /* Easter egg: hearts are clickable and recolor the big C. */
  .doodles { z-index: 2; }
  .doodle.heart { pointer-events: auto; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .doodle.red { color: var(--crayon, #E63946); }
  .doodle.pink { color: #F28DB2; }
  .doodle.gold { color: #F2B705; }
  .doodle.blue { color: #5B8DEF; }
  @keyframes pop { to { opacity: 0.85; transform: rotate(var(--r)) scale(1); } }
  @media (max-width: 640px) {
    .doodle.wide { display: none; }
    .doodle.m-low { top: 90%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .doodle { animation: none; opacity: 0.85; transform: rotate(var(--r)); }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="doodles" aria-hidden="true">
    <svg width="0" height="0" style="position:absolute"><defs>
      <symbol id="heart" viewBox="0 0 100 100"><path d="M50 84 C22 64 8 46 14 30 C20 13 42 12 50 31 C58 12 80 13 86 30 C92 46 78 64 50 84 Z"/></symbol>
      <symbol id="star" viewBox="0 0 100 100"><path d="M50.0 12.0 L60.6 39.4 L89.9 41.0 L67.1 59.6 L74.7 88.0 L50.0 72.0 L25.3 88.0 L32.9 59.6 L10.1 41.0 L39.4 39.4 Z"/></symbol>
    </defs></svg>
    <svg class="doodle red heart" style="--x:6%;--y:10%;--s:52px;--r:-14deg;--d:2.2s"><use href="#heart"/></svg>
    <svg class="doodle gold" style="--x:88%;--y:8%;--s:60px;--r:12deg;--d:2.4s"><use href="#star"/></svg>
    <svg class="doodle pink wide heart" style="--x:74%;--y:30%;--s:34px;--r:-8deg;--d:2.6s"><use href="#heart"/></svg>
    <svg class="doodle blue m-low" style="--x:16%;--y:72%;--s:40px;--r:18deg;--d:2.8s"><use href="#star"/></svg>
    <svg class="doodle red heart" style="--x:90%;--y:70%;--s:48px;--r:-10deg;--d:3.0s"><use href="#heart"/></svg>
    <svg class="doodle pink wide" style="--x:48%;--y:6%;--s:30px;--r:20deg;--d:3.2s"><use href="#star"/></svg>
    <svg class="doodle gold wide" style="--x:58%;--y:86%;--s:38px;--r:-16deg;--d:3.4s"><use href="#star"/></svg>
    <svg class="doodle blue wide heart" style="--x:34%;--y:90%;--s:30px;--r:8deg;--d:3.6s"><use href="#heart"/></svg>
    <svg class="doodle gold wide" style="--x:3%;--y:44%;--s:28px;--r:10deg;--d:3.8s"><use href="#star"/></svg>
    <svg class="doodle blue wide" style="--x:80%;--y:52%;--s:26px;--r:-20deg;--d:4.0s"><use href="#star"/></svg>
  </div>
  <div class="hero-inner">
    <svg class="letter" viewBox="0 0 200 200" role="img" aria-label="A crayon letter C">
      <defs>
        <filter id="crayon">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
        </filter>
      </defs>
      <path class="guide" d="M149.5 50.5 A70 70 0 1 0 149.5 149.5"/>
      <path class="stroke" pathLength="100" d="M149.5 50.5 A70 70 0 1 0 149.5 149.5"/>
    </svg>
    <div>
      <h1>C is for Creativity</h1>
      <p class="school">A 2nd grade business at QL</p>
      <p class="team">Made by Sydney and friends</p>
      <p class="stamp">Coming soon</p>
      <br>
      <a class="scroll-hint" href="gallery.html">See what we made &rarr;</a>
    </div>
  </div>
</header>

<script>
  // Easter egg: each heart click re-traces the big C in the next crayon color.
  (function () {
    var colors = ['#F28DB2', '#F2B705', '#5B8DEF', '#2BA84A', '#8E5BD9', '#F5821F', '#1FAFA8', '#E63946'];
    var next = 0;
    var stroke = document.querySelector('.letter .stroke');
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    document.querySelectorAll('.doodle.heart').forEach(function (heart) {
      heart.addEventListener('click', function () {
        stroke.style.stroke = colors[next];
        next = (next + 1) % colors.length;
        if (!reduceMotion.matches) {
          stroke.style.animation = 'none';
          void stroke.getBoundingClientRect();
          stroke.style.animation = 'trace 1.6s ease-in-out forwards';
          var r = getComputedStyle(heart).getPropertyValue('--r').trim() || '0deg';
          if (heart.animate) {
            heart.animate([
              { transform: 'rotate(' + r + ') scale(1)' },
              { transform: 'rotate(' + r + ') scale(1.35)' },
              { transform: 'rotate(' + r + ') scale(1)' }
            ], { duration: 350, easing: 'ease-out' });
          }
        }
      });
    });
  })();
</script>
</body>
</html>
