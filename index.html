<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta property="og:title" content="C is for Creativity">
<meta property="og:description" content="A 2nd grade business by Sydney and friends.">
<meta property="og:image" content="https://cisforcreativity.com/images/flower.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖍️</text></svg>">
<link rel="preload" href="fonts/andika-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/andika-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- Bump ?v= whenever styles.css changes so browsers fetch the new file. -->
<link rel="stylesheet" href="styles.css?v=2">
<style>
  /* Kept in the page itself so these rules always match this markup. */
  /* Hand-drawn hearts and stars behind the hero */
  .hero { position: relative; }
  .hero-inner { position: relative; z-index: 1; }
  .doodles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .doodle {
    position: absolute;
    left: min(var(--x), calc(100% - var(--s) - 12px));
    top: var(--y);
    width: var(--s);
    height: var(--s);
    overflow: visible;
    fill: currentColor;
    fill-opacity: 0.15;
    stroke: currentColor;
    stroke-width: 6;
    stroke-linejoin: round;
    filter: url(#crayon);
    opacity: 0;
    transform: rotate(var(--r)) scale(0.4);
    animation: pop 0.5s var(--d) cubic-bezier(.3, 1.6, .5, 1) forwards;
  }
  /* Easter eggs: hearts recolor the big C, stars switch to space. */
  .doodles { z-index: 2; }
  .doodle.heart, .doodle.star { pointer-events: auto; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .doodle.red { color: var(--crayon, #E63946); }
  .doodle.pink { color: #F28DB2; }
  .doodle.gold { color: #F2B705; }
  .doodle.blue { color: #5B8DEF; }
  @keyframes pop { to { opacity: 0.85; transform: rotate(var(--r)) scale(1); } }
  /* Space mode (tap a star): starry sky, the solar system, and the C becomes Earth. */
  .space-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    transition: opacity 1.2s ease, visibility 0s linear 1.2s;
    background:
      radial-gradient(ellipse 60% 45% at 18% 25%, rgba(132, 70, 210, 0.32), transparent 70%),
      radial-gradient(ellipse 50% 40% at 85% 15%, rgba(40, 120, 230, 0.26), transparent 70%),
      radial-gradient(ellipse 70% 50% at 60% 95%, rgba(220, 70, 140, 0.18), transparent 70%),
      linear-gradient(180deg, #050816 0%, #0b1030 55%, #120a2a 100%);
  }
  html.space .space-layer { opacity: 1; visibility: visible; transition: opacity 1.2s ease; }
  html:not(.space) .space-layer *, html:not(.space) .earth * { animation-play-state: paused !important; }
  .starfield { position: absolute; inset: 0; width: 100%; height: 100%; }
  .starfield circle { fill: #fff; }
  .starfield .tw { animation: twinkle var(--tw, 3s) ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: 1; } to { opacity: 0.2; } }
  .shooting {
    position: absolute;
    top: 14%;
    left: -12%;
    width: 160px;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0), #fff);
    opacity: 0;
    animation: shoot 11s 1.5s linear infinite;
  }
  @keyframes shoot {
    0% { transform: translate(0, 0) rotate(16deg); opacity: 0; }
    1% { opacity: 1; }
    8% { transform: translate(80vw, 23vw) rotate(16deg); opacity: 0; }
    100% { transform: translate(80vw, 23vw) rotate(16deg); opacity: 0; }
  }

  /* The solar system. Orbits are circles squashed into ellipses; each planet
     spins backwards and un-squashes itself so it stays round. */
  .solar { position: absolute; left: 74%; top: 74%; width: 0; height: 0; }
  .orbits { position: absolute; left: 0; top: 0; transform: scaleY(0.38); }
  .orbit {
    position: absolute;
    left: calc(var(--a) * -1);
    top: calc(var(--a) * -1);
    width: calc(var(--a) * 2);
    height: calc(var(--a) * 2);
    border: 1.5px solid rgba(190, 205, 255, 0.18);
    border-radius: 50%;
    animation: orbit var(--t) linear infinite;
    animation-delay: var(--p);
  }
  .planet {
    position: absolute;
    left: 100%;
    top: 50%;
    width: var(--w);
    height: var(--w);
    margin: calc(var(--w) / -2) 0 0 calc(var(--w) / -2);
    border-radius: 50%;
    background: var(--bg);
    box-shadow: inset -3px -2px 6px rgba(0, 0, 0, 0.55), 0 0 8px rgba(255, 255, 255, 0.15);
    transform: scaleY(2.6316);
    animation: counter var(--t) linear infinite;
    animation-delay: var(--p);
  }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes counter {
    from { transform: rotate(0deg) scaleY(2.6316); }
    to { transform: rotate(-360deg) scaleY(2.6316); }
  }
  .mercury { --a: 95px; --t: 6s; --p: -2s; --w: 7px; --bg: radial-gradient(circle at 35% 35%, #e4ded8, #8a8580); }
  .venus { --a: 130px; --t: 10s; --p: -7s; --w: 11px; --bg: radial-gradient(circle at 35% 35%, #fff4d0, #d9b26f); }
  .earthlet { --a: 168px; --t: 14s; --p: -3s; --w: 11px; --bg: radial-gradient(circle at 35% 35%, #9fe0a0 0 18%, #4f9ef0 22%, #1d4f9c); }
  .mars { --a: 205px; --t: 20s; --p: -13s; --w: 9px; --bg: radial-gradient(circle at 35% 35%, #ffb896, #c1440e); }
  .jupiter { --a: 270px; --t: 34s; --p: -9s; --w: 30px;
    --bg: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.35), transparent 55%),
          linear-gradient(#e8cfa6 0 18%, #c48a5a 18% 28%, #efdcb8 28% 44%, #b97848 44% 54%, #e9d3ae 54% 70%, #c99366 70% 80%, #e8cfa6 80%); }
  .saturn { --a: 340px; --t: 48s; --p: -30s; --w: 24px; --bg: radial-gradient(circle at 35% 35%, #fff3cf, #d8b878 70%, #b8955a); }
  .saturn .planet::before {
    content: "";
    position: absolute;
    left: -62%;
    top: 36%;
    width: 224%;
    height: 28%;
    border-radius: 50%;
    border: 3px solid rgba(236, 214, 165, 0.8);
    box-shadow: 0 0 0 2px rgba(200, 170, 120, 0.35);
    transform: rotate(-16deg);
  }
  .uranus { --a: 405px; --t: 66s; --p: -50s; --w: 16px; --bg: radial-gradient(circle at 35% 35%, #e0fcff, #7fd6e0); }
  .neptune { --a: 465px; --t: 84s; --p: -20s; --w: 16px; --bg: radial-gradient(circle at 35% 35%, #a8c8ff, #2f55c9); }
  .sun {
    position: absolute;
    left: -38px;
    top: -38px;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: radial-gradient(circle at 45% 45%, #fffbe0, #ffd84d 45%, #ff9a1f 80%, #ff7a00);
    box-shadow: 0 0 40px 12px rgba(255, 190, 60, 0.65), 0 0 130px 55px rgba(255, 130, 20, 0.28);
    animation: sunglow 4s ease-in-out infinite alternate;
  }
  @keyframes sunglow { to { box-shadow: 0 0 52px 18px rgba(255, 200, 70, 0.75), 0 0 160px 70px rgba(255, 130, 20, 0.32); } }

  /* The big C turns into Earth. */
  .letter { overflow: visible; }
  .letter .guide, .letter .stroke { transition: opacity 0.6s ease; }
  html.space .letter .guide, html.space .letter .stroke { opacity: 0; }
  .earth {
    opacity: 0;
    transform: scale(0.3) rotate(-30deg);
    transform-origin: 100px 100px;
    transition: opacity 0.7s ease, transform 1s cubic-bezier(.3, 1.4, .5, 1);
  }
  html.space .earth { opacity: 1; transform: none; transition-delay: 0.3s; }
  .earth .land { animation: drift 26s linear infinite; }
  .earth .clouds { animation: drift 17s linear infinite; }
  /* West to east, like the real Earth: land drifts left to right. */
  @keyframes drift { from { transform: translateX(-280px); } to { transform: translateX(0); } }

  /* Light text on the dark sky. */
  body { transition: color 0.8s ease; }
  html.space body { color: #EEF1FF; }
  html.space .hero-inner { text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7); }
  html.space .stamp { color: #FF9EB1; border-color: #FF9EB1; }
  html.space .hero a { color: #FFD166; }
  html.space .doodle { fill-opacity: 0.4; }

  @media (max-width: 640px) {
    .solar { left: 50%; top: 86%; transform: scale(0.5); }
  }
  @media (prefers-reduced-motion: reduce) {
    .space-layer *, .earth, .earth * { animation: none !important; transition: none !important; }
    .space-layer { transition: none; }
  }
  /* Space rocket: a cougar pilot towing a banner, flies across once per trip to space. */
  .flight {
    position: fixed;
    left: 0;
    top: 7vh;
    z-index: 3;
    pointer-events: none;
    display: flex;
    align-items: center;
    opacity: 0;
    will-change: transform;
  }
  .flight-bob { display: flex; align-items: center; animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-8px) rotate(1.5deg); }
  }
  .banner {
    position: relative;
    padding: 0.35em 0.9em 0.35em 1.4em;
    font-size: clamp(1.05rem, 2.6vw, 1.6rem);
    font-weight: 700;
    white-space: nowrap;
    color: #B3202E;
    background: linear-gradient(180deg, #FFF8E7, #F6E7C4);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0.7em 50%);
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.08);
    transform-origin: right center;
    animation: wave 1.4s ease-in-out infinite;
    text-shadow: none;
  }
  @keyframes wave {
    0%, 100% { transform: skewY(-1.5deg) scaleY(1); }
    50% { transform: skewY(1.5deg) scaleY(0.96); }
  }
  .tow { width: clamp(36px, 5vw, 56px); height: clamp(64px, 9vw, 92px); flex: 0 0 auto; }
  .rocket { width: clamp(150px, 19vw, 230px); height: auto; flex: 0 0 auto; overflow: visible; }
  .rocket .flame { transform-box: fill-box; transform-origin: right center; animation: flicker 0.14s ease-in-out infinite alternate; }
  @keyframes flicker { from { transform: scaleX(0.8) scaleY(0.92); } to { transform: scaleX(1.12) scaleY(1.04); } }
  @media (max-width: 640px) {
    /* Small enough that the whole message fits on a phone screen at once. */
    .banner { font-size: 0.95rem; }
    .tow { width: 24px; height: 56px; }
    .rocket { width: 110px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flight-bob, .banner, .rocket .flame { animation: none; }
  }
  @media (max-width: 640px) {
    .doodle.wide { display: none; }
    .doodle.m-low { top: 90%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .doodle { animation: none; opacity: 0.85; transform: rotate(var(--r)); }
  }
</style>
</head>
<body>
<div class="space-layer" aria-hidden="true">
  <svg class="starfield"></svg>
  <div class="shooting"></div>
  <div class="solar">
    <div class="orbits">
      <div class="orbit mercury"><div class="planet"></div></div>
      <div class="orbit venus"><div class="planet"></div></div>
      <div class="orbit earthlet"><div class="planet"></div></div>
      <div class="orbit mars"><div class="planet"></div></div>
      <div class="orbit jupiter"><div class="planet"></div></div>
      <div class="orbit saturn"><div class="planet"></div></div>
      <div class="orbit uranus"><div class="planet"></div></div>
      <div class="orbit neptune"><div class="planet"></div></div>
    </div>
    <div class="sun"></div>
  </div>
</div>
<div class="flight" aria-hidden="true">
  <div class="flight-bob">
    <div class="banner">Hello 2nd Grade Cougars</div>
    <svg class="tow" viewBox="0 0 50 90" preserveAspectRatio="none">
      <path d="M0 22 Q28 40 50 52 M0 68 Q28 58 50 52" fill="none" stroke="#c9d3ea" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <svg class="rocket" viewBox="0 0 200 100">
      <defs>
        <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="0.55" stop-color="#e9edf5"/>
          <stop offset="1" stop-color="#b9c2d4"/>
        </linearGradient>
        <radialGradient id="glass" cx="40%" cy="35%" r="70%">
          <stop offset="0" stop-color="#e6f6ff"/>
          <stop offset="1" stop-color="#8fc9f0"/>
        </radialGradient>
        <clipPath id="window"><circle cx="112" cy="50" r="21"/></clipPath>
      </defs>
      <g class="flame">
        <path d="M44 36 Q4 50 44 64 Q26 50 44 36 Z" fill="#ff8a1f"/>
        <path d="M44 42 Q20 50 44 58 Q34 50 44 42 Z" fill="#ffe066"/>
      </g>
      <path d="M45 30 L28 6 Q26 2 31 3 L74 30 Z" fill="#E63946"/>
      <path d="M45 70 L28 94 Q26 98 31 97 L74 70 Z" fill="#E63946"/>
      <path d="M40 30 L140 30 Q182 30 198 50 Q182 70 140 70 L40 70 Q33 50 40 30 Z" fill="url(#hull)"/>
      <path d="M150 30 Q182 30 198 50 Q182 70 150 70 Q160 50 150 30 Z" fill="#E63946"/>
      <rect x="40" y="46" width="38" height="8" rx="4" fill="#5B8DEF" opacity="0.85"/>
      <circle cx="112" cy="50" r="21" fill="url(#glass)"/>
      <g clip-path="url(#window)">
        <g transform="translate(112 52) scale(1.45) translate(-112 -52)">
          <circle cx="104" cy="42.5" r="4.3" fill="#7a4e28"/>
          <circle cx="120" cy="42.5" r="4.3" fill="#7a4e28"/>
          <circle cx="104.4" cy="43" r="2.4" fill="#ecc9a0"/>
          <circle cx="119.6" cy="43" r="2.4" fill="#ecc9a0"/>
          <ellipse cx="112" cy="52" rx="12.2" ry="11.2" fill="#d49a5c"/>
          <ellipse cx="112" cy="46" rx="5" ry="3" fill="#dfac72"/>
          <ellipse cx="104.6" cy="56.2" rx="1.5" ry="2.6" fill="#4a3020" opacity="0.85"/>
          <ellipse cx="119.4" cy="56.2" rx="1.5" ry="2.6" fill="#4a3020" opacity="0.85"/>
          <ellipse cx="108.4" cy="57.4" rx="4.4" ry="3.4" fill="#fff7ec"/>
          <ellipse cx="115.6" cy="57.4" rx="4.4" ry="3.4" fill="#fff7ec"/>
          <ellipse cx="112" cy="61.2" rx="3" ry="1.7" fill="#fff7ec"/>
          <path d="M109.4 51 Q108.8 53.2 109.8 54.6 M114.6 51 Q115.2 53.2 114.2 54.6" fill="none" stroke="#8a5a30" stroke-width="0.7" stroke-linecap="round"/>
          <circle cx="107.6" cy="49.6" r="2.1" fill="#e2a62a"/>
          <circle cx="116.4" cy="49.6" r="2.1" fill="#e2a62a"/>
          <ellipse cx="107.6" cy="49.6" rx="0.8" ry="1.6" fill="#1f1a17"/>
          <ellipse cx="116.4" cy="49.6" rx="0.8" ry="1.6" fill="#1f1a17"/>
          <circle cx="108.2" cy="48.9" r="0.5" fill="#fff"/>
          <circle cx="117" cy="48.9" r="0.5" fill="#fff"/>
          <path d="M109.7 53.8 Q112 53 114.3 53.8 Q113.1 56 112 56.2 Q110.9 56 109.7 53.8 Z" fill="#df8686" stroke="#5a3a2a" stroke-width="0.4"/>
          <path d="M112 56.2 L112 57.8 M112 57.8 Q110.3 59.4 108.8 58.6 M112 57.8 Q113.7 59.4 115.2 58.6" fill="none" stroke="#5a3a2a" stroke-width="0.7" stroke-linecap="round"/>
          <path d="M106 57 L99.5 55.6 M106 58.4 L99.5 59.2 M118 57 L124.5 55.6 M118 58.4 L124.5 59.2" stroke="#ffffff" stroke-width="0.35" opacity="0.9" stroke-linecap="round"/>
        </g>
      </g>
      <circle cx="112" cy="50" r="21" fill="none" stroke="#9aa7bd" stroke-width="4"/>
      <ellipse cx="102" cy="38" rx="5" ry="2.6" fill="#ffffff" opacity="0.4"/>
    </svg>
  </div>
</div>
<header class="hero">
  <div class="doodles" aria-hidden="true">
    <svg width="0" height="0" style="position:absolute"><defs>
      <symbol id="heart" viewBox="0 0 100 100"><path d="M50 84 C22 64 8 46 14 30 C20 13 42 12 50 31 C58 12 80 13 86 30 C92 46 78 64 50 84 Z"/></symbol>
      <symbol id="star" viewBox="0 0 100 100"><path d="M50.0 12.0 L60.6 39.4 L89.9 41.0 L67.1 59.6 L74.7 88.0 L50.0 72.0 L25.3 88.0 L32.9 59.6 L10.1 41.0 L39.4 39.4 Z"/></symbol>
    </defs></svg>
    <svg class="doodle red heart" style="--x:6%;--y:10%;--s:52px;--r:-14deg;--d:2.2s"><use href="#heart"/></svg>
    <svg class="doodle gold star" style="--x:88%;--y:8%;--s:60px;--r:12deg;--d:2.4s"><use href="#star"/></svg>
    <svg class="doodle pink wide heart" style="--x:74%;--y:30%;--s:34px;--r:-8deg;--d:2.6s"><use href="#heart"/></svg>
    <svg class="doodle blue m-low star" style="--x:16%;--y:72%;--s:40px;--r:18deg;--d:2.8s"><use href="#star"/></svg>
    <svg class="doodle red heart" style="--x:90%;--y:70%;--s:48px;--r:-10deg;--d:3.0s"><use href="#heart"/></svg>
    <svg class="doodle pink wide star" style="--x:48%;--y:6%;--s:30px;--r:20deg;--d:3.2s"><use href="#star"/></svg>
    <svg class="doodle gold wide star" style="--x:58%;--y:86%;--s:38px;--r:-16deg;--d:3.4s"><use href="#star"/></svg>
    <svg class="doodle blue wide heart" style="--x:34%;--y:90%;--s:30px;--r:8deg;--d:3.6s"><use href="#heart"/></svg>
    <svg class="doodle gold wide star" style="--x:3%;--y:44%;--s:28px;--r:10deg;--d:3.8s"><use href="#star"/></svg>
    <svg class="doodle blue wide star" style="--x:80%;--y:52%;--s:26px;--r:-20deg;--d:4.0s"><use href="#star"/></svg>
  </div>
  <div class="hero-inner">
    <svg class="letter" viewBox="0 0 200 200" role="img" aria-label="A crayon letter C">
      <defs>
        <filter id="crayon">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
        </filter>
        <radialGradient id="ocean" cx="45%" cy="40%" r="65%">
          <stop offset="0" stop-color="#5fb4ff"/>
          <stop offset="0.6" stop-color="#2166c9"/>
          <stop offset="1" stop-color="#0d2f6e"/>
        </radialGradient>
        <radialGradient id="earthShade" cx="38%" cy="35%" r="75%">
          <stop offset="0.45" stop-color="#000814" stop-opacity="0"/>
          <stop offset="1" stop-color="#000814" stop-opacity="0.7"/>
        </radialGradient>
        <clipPath id="earthClip"><circle cx="100" cy="100" r="70"/></clipPath>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
      </defs>
      <g class="earth">
        <circle cx="100" cy="100" r="76" fill="none" stroke="#7fc4ff" stroke-width="8" opacity="0.55" filter="url(#glow)"/>
        <g clip-path="url(#earthClip)">
          <circle cx="100" cy="100" r="70" fill="url(#ocean)"/>

<script>
  // Easter eggs: tap a heart to re-draw the big C in a new color,
  // tap a star to fly into space (tap a star again to come back).
  // A cougar pilot's rocket flies past once on each trip to space.
  (function () {
    var colors = ['#F28DB2', '#F2B705', '#5B8DEF', '#2BA84A', '#8E5BD9', '#F5821F', '#1FAFA8', '#E63946'];
    var next = 0;
    var stroke = document.querySelector('.letter .stroke');
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    function bounce(el) {
      if (reduceMotion.matches || !el.animate) return;
      var r = getComputedStyle(el).getPropertyValue('--r').trim() || '0deg';
      el.animate([
        { transform: 'rotate(' + r + ') scale(1)' },
        { transform: 'rotate(' + r + ') scale(1.35)' },
        { transform: 'rotate(' + r + ') scale(1)' }
      ], { duration: 350, easing: 'ease-out' });
    }

    document.querySelectorAll('.doodle.heart').forEach(function (heart) {
      heart.addEventListener('click', function () {
        stroke.style.stroke = colors[next];
        next = (next + 1) % colors.length;
        if (!reduceMotion.matches) {
          stroke.style.animation = 'none';
          void stroke.getBoundingClientRect();
          stroke.style.animation = 'trace 1.6s ease-in-out forwards';
        }
        bounce(heart);
      });
    });

    var starsMade = false;
    function makeStarfield() {
      var svg = document.querySelector('.starfield');
      var ns = 'http://www.w3.org/2000/svg';
      for (var i = 0; i < 220; i++) {
        var c = document.createElementNS(ns, 'circle');
        c.setAttribute('cx', (Math.random() * 100).toFixed(2) + '%');
        c.setAttribute('cy', (Math.random() * 100).toFixed(2) + '%');
        var big = Math.random() < 0.12;
        c.setAttribute('r', big ? (1.3 + Math.random()).toFixed(2) : (0.4 + Math.random() * 0.8).toFixed(2));
        c.setAttribute('opacity', (0.5 + Math.random() * 0.5).toFixed(2));
        if (Math.random() < 0.35) {
          c.setAttribute('class', 'tw');
          c.style.setProperty('--tw', (1.5 + Math.random() * 3).toFixed(2) + 's');
          c.style.animationDelay = (-Math.random() * 4).toFixed(2) + 's';
        }
        svg.appendChild(c);
      }
      starsMade = true;
    }

    // The rocket crosses the screen once, slowly, each trip to space.
    var flight = document.querySelector('.flight');
    var trip = null;
    function launch() {
      land();
      if (!flight.animate) return;
      var vw = window.innerWidth;
      var w = flight.offsetWidth;
      if (reduceMotion.matches) {
        var x = Math.max(8, (vw - w) / 2) + 'px';
        trip = flight.animate([
          { transform: 'translateX(' + x + ')', opacity: 0 },
          { transform: 'translateX(' + x + ')', opacity: 1, offset: 0.1 },
          { transform: 'translateX(' + x + ')', opacity: 1, offset: 0.9 },
          { transform: 'translateX(' + x + ')', opacity: 0 }
        ], { duration: 7000, delay: 1200 });
        return;
      }
      var speed = vw < 640 ? 75 : 105;
      trip = flight.animate([
        { transform: 'translateX(' + (-w) + 'px)', opacity: 1 },
        { transform: 'translateX(' + vw + 'px)', opacity: 1 }
      ], { duration: (vw + w) / speed * 1000, delay: 1400, easing: 'linear' });
    }
    function land() {
      if (trip) { trip.cancel(); trip = null; }
    }

    document.querySelectorAll('.doodle.star').forEach(function (star) {
      star.addEventListener('click', function () {
        if (!starsMade) makeStarfield();
        var inSpace = document.documentElement.classList.toggle('space');
        if (inSpace) launch(); else land();
        bounce(star);
      });
    });
  })();
</script>
