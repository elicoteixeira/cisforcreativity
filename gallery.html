<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Creations | C is for Creativity</title>
<meta name="description" content="Everything made so far by C is for Creativity, a 2nd grade business.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖍️</text></svg>">
<link rel="preload" href="fonts/andika-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/andika-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- Bump ?v= whenever styles.css changes so browsers fetch the new file. -->
<link rel="stylesheet" href="styles.css?v=2">
<style>
  /* Kept in the page itself so these rules always match this markup. */
  .gallery { margin-top: 2.5rem; counter-reset: creation; }
  .gallery li { counter-increment: creation; }
  /* Number badge on each photo: #1, #2, ... counted automatically in list order. */
  .gallery .sticker::after {
    content: "#" counter(creation);
    position: absolute;
    top: -14px;
    left: -14px;
    z-index: 2;
    display: grid;
    place-items: center;
    width: 3.2rem;
    height: 3.2rem;
    border-radius: 50%;
    font-size: 1.35rem;
    font-weight: 700;
    color: #fff;
    background: var(--crayon, #E63946);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    transform: rotate(-8deg);
  }
</style>
</head>
<body>
<main class="section">
  <a class="back" href="./">&larr; Home</a>
  <h1>Our creations</h1>

  <!-- To add a creation: copy one <li> block, change the image, caption, and story. The #number badge counts itself. -->
  <ul class="gallery">
    <li>
      <figure class="sticker">
        <img src="images/flower.png" width="581" height="826" alt="A rainbow clay flower with pink, blue, and red petals and a yellow and green stem">
      </figure>
      <p class="caption"><span class="num">Order #1:</span> a clay flower for our teacher</p>
      <p class="story">
        Ms. C ordered a flower. She didn't say the color, so we went with rainbow colors.
        <span class="by">by Sydney</span>
      </p>
    </li>
  </ul>
</main>
</body>
</html>
