<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Creations | C is for Creativity</title>
<meta name="description" content="Everything made so far by C is for Creativity, a 2nd grade business.">
<meta property="og:title" content="Our creations | C is for Creativity">
<meta property="og:description" content="Creations made by C is for Creativity.">
<meta property="og:url" content="https://cisforcreativity.com/gallery.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="C is for Creativity">
<meta property="og:image" content="https://cisforcreativity.com/images/share-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A red crayon letter C on notebook paper with the words C is for Creativity and CisforCreativity.com">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖍️</text></svg>">
<link rel="preload" href="fonts/patrick-hand-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/andika-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/andika-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- Bump ?v= whenever styles.css changes so browsers fetch the new file. -->
<link rel="stylesheet" href="styles.css?v=7">
<style>
  /* Kept in the page itself so these rules always match this markup. */
  .gallery { margin-top: 2.5rem; }
  /* Number for each creation, hand-drawn in red crayon strokes like the big C on the
     home page. The script at the bottom writes #1, #2, ... in list order. */
  .gallery { column-gap: 4.5rem; }
  .gallery li { position: relative; }
  /* snap.js puts each line of regular text between a dotted line and a solid line. */
  .gallery .caption { margin: 1rem 0 0.75rem; }
  .gallery .story { padding: 0.25rem 1.25rem; }
  .gallery .story p { margin: 0; }
  .gallery .story .by { font-size: 0.9em; }
  .hand-num {
    position: absolute;
    top: 1rem;
    right: calc(100% + 1.2rem);
    height: 3rem;
    width: auto;
    overflow: visible;
    fill: none;
    stroke: var(--crayon, #E63946);
    stroke-width: 6.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: url(#crayon);
  }
  @media (max-width: 640px) {
    /* No room in the margin on phones: write the number just above the photo. */
    .hand-num { position: static; display: block; margin-bottom: 0.4rem; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="crayon">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
  </filter>
</svg>
<main class="section" data-snap-root>
  <a class="back" data-snap href="./">&larr; Home</a>
  <h1 data-snap="span">Our creations</h1>

  <!-- To add a creation: copy one <li> block, change the image, caption, and story. The #number is written automatically. -->
  <ul class="gallery">
    <li>
      <figure class="sticker">
        <img src="images/flower.png" width="581" height="826" alt="A rainbow clay flower with pink, blue, and red petals and a yellow and green stem">
      </figure>
      <p class="caption" data-snap><span class="num">Order #1:</span> a clay flower for our teacher</p>
      <div class="story">
        <p data-snap>Ms. C ordered a flower. She didn't say the color, so we went with rainbow colors.</p>
        <p class="by" data-snap>by Sydney</p>
      </div>
    </li>
  </ul>
</main>
<script>
  // Write each creation's number (#1, #2, ...) as crayon pen strokes, one path per character.
  (function () {
    var glyphs = {
      '#': 'M11 8 L8 44 M22 8 L19 44 M3 19 L28 19 M2 33 L27 33',
      '0': 'M15 4 C4 4 3 18 3 25 C3 34 6 46 15 46 C24 46 27 34 27 25 C27 16 25 4 15 4 Z',
      '1': 'M8 12 L17 4 L17 46',
      '2': 'M4 14 C5 6 11 3 16 3 C23 3 27 8 26 15 C25 22 18 28 4 46 L27 46',
      '3': 'M5 8 C9 3 23 2 24 11 C25 19 16 23 12 23 C20 23 27 27 26 36 C25 46 9 48 4 41',
      '4': 'M20 46 L20 4 L3 32 L28 32',
      '5': 'M25 4 L8 4 L6 21 C11 18 16 18 20 19 C27 22 27 31 26 36 C24 46 9 48 4 41',
      '6': 'M23 6 C17 2 6 5 4 20 C2 34 6 46 15 46 C23 46 26 39 26 33 C26 26 21 22 15 22 C9 22 5 27 4 31',
      '7': 'M3 4 L27 4 L12 46',
      '8': 'M15 23 C7 21 5 16 5 12 C5 6 10 3 15 3 C20 3 25 6 25 12 C25 17 21 21 15 23 C8 25 4 30 4 35 C4 42 9 47 15 47 C21 47 26 42 26 35 C26 30 22 25 15 23 Z',
      '9': 'M26 18 C25 25 20 27 15 27 C8 27 4 22 4 15 C4 8 9 3 15 3 C22 3 26 8 26 18 C26 30 24 46 10 46'
    };
    // Small per-character wobble (tilt, baseline, size) so it reads as handwriting.
    var tilt = [-4, 3, -2, 4, -3];
    var lift = [0, -1.5, 1, -0.5, 1.5];
    var size = [1, 0.96, 1.04, 0.98, 1.02];
    var ns = 'http://www.w3.org/2000/svg';
    document.querySelectorAll('.gallery > li').forEach(function (li, i) {
      var text = '#' + (i + 1);
      var svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('class', 'hand-num');
      svg.setAttribute('data-snap', 'span');
      svg.setAttribute('data-snap-ratio', String(27 / 60)); // middle of the digits
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', 'Number ' + (i + 1));
      var x = 0;
      for (var k = 0; k < text.length; k++) {
        var path = document.createElementNS(ns, 'path');
        path.setAttribute('d', glyphs[text[k]]);
        var j = (i + k) % tilt.length;
        var sc = text[k] === '#' ? 0.8 : size[j];
        var dy = text[k] === '#' ? 6 : lift[j];
        path.setAttribute('transform', 'translate(' + x + ' ' + dy + ') rotate(' + tilt[j] + ' 15 25) translate(15 25) scale(' + sc + ') translate(-15 -25)');
        svg.appendChild(path);
        x += text[k] === '#' ? 27 : 33;
      }
      svg.setAttribute('viewBox', '-5 -4 ' + (x + 4) + ' 60');
      li.insertBefore(svg, li.firstChild);
    });
  })();
</script>
<script src="snap.js?v=9"></script>
</body>
</html>
